<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agentic FIRE Planner — for NRIs</title>
<meta name="description" content="An agentic FIRE planning tool for NRIs. Hold the numbers loosely, the context tightly, and let an agent do the scenario work." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  :root {
    --navy: #0f1729;
    --ink: #1a1a2e;
    --muted: #6b7280;
    --border: #e5e7eb;
    --border-soft: #eef0f3;
    --cream: #f5f1ea;
    --paper: #fcfbf7;
    --blue: #2563eb;
    --blue-soft: #dbeafe;
    --blue-deep: #1e40af;
    --green: #059669;
    --red: #dc2626;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .ext-bg {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 10%, #ede5d6 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, #e8eef5 0%, transparent 45%),
      var(--cream);
    padding: 32px 16px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .ext-header { max-width: 420px; width: 100%; margin-bottom: 24px; text-align: center; }
  .ext-header .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .ext-header .title {
    font-family: 'Fraunces', serif; font-weight: 500; font-size: 32px;
    line-height: 1.1; color: var(--navy); letter-spacing: -0.02em; margin: 0;
  }
  .ext-header .title em { font-style: italic; font-weight: 400; color: var(--blue-deep); }
  .ext-header .sub { font-size: 13px; color: var(--muted); margin-top: 6px; }

  .phone {
    width: 390px; max-width: 100%;
    background: var(--paper);
    border-radius: 36px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.9) inset,
      0 30px 80px -20px rgba(15,23,41,0.25),
      0 8px 16px -8px rgba(15,23,41,0.15);
    border: 1px solid rgba(15,23,41,0.08);
    overflow: hidden;
    display: flex; flex-direction: column;
    height: 780px;
    position: relative;
  }

  .status-bar {
    height: 36px; background: var(--paper);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    font-size: 11px; font-weight: 600; color: var(--ink);
  }
  .notch {
    width: 90px; height: 24px; background: var(--ink);
    border-radius: 14px; position: relative;
  }
  .notch::after {
    content: ''; position: absolute; right: 8px; top: 50%;
    transform: translateY(-50%);
    width: 8px; height: 8px; background: var(--red); border-radius: 50%;
  }

  .tab-content {
    flex: 1; overflow-y: auto;
    padding: 4px 20px 16px;
    scrollbar-width: thin;
  }
  .tab-content::-webkit-scrollbar { width: 4px; }
  .tab-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .tab-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 4px 10px;
  }
  .tab-title {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 26px; color: var(--navy); letter-spacing: -0.02em; margin: 0;
  }

  .ccy-toggle {
    display: flex; background: var(--cream);
    border-radius: 20px; padding: 3px; gap: 2px;
  }
  .ccy-toggle button {
    border: none; background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    padding: 5px 12px; border-radius: 16px;
    color: var(--muted); cursor: pointer; transition: all 0.2s;
    display: flex; align-items: center; gap: 4px;
  }
  .ccy-toggle button.active {
    background: var(--paper); color: var(--navy);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }

  .nw-card {
    background: var(--paper);
    border: 1px solid var(--border-soft);
    border-radius: 18px;
    padding: 18px 20px;
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px;
  }
  .nw-card .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 4px;
  }
  .nw-card .big {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 28px; color: var(--navy); letter-spacing: -0.02em; line-height: 1;
  }
  .nw-card .meta {
    font-size: 11px; color: var(--muted); margin-top: 4px;
    font-feature-settings: "tnum";
  }
  .eye-btn {
    border: none; background: var(--cream); padding: 8px;
    border-radius: 10px; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  .section-label {
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--muted); margin: 18px 0 8px;
  }

  .pill-toggle {
    position: absolute; left: 50%; transform: translateX(-50%);
    background: var(--paper); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px;
    font-size: 12px; font-weight: 600; color: var(--blue-deep);
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(15,23,41,0.08);
    display: flex; align-items: center; gap: 6px;
  }

  .updates-card {
    background: var(--paper); border: 1px solid var(--border-soft);
    border-radius: 16px; padding: 14px 16px; margin-top: 16px;
  }
  .updates-card h4 {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 16px; color: var(--navy); margin: 0 0 10px;
  }
  .update-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px;
    background: rgba(219,234,254,0.4);
    border-radius: 10px; margin-bottom: 6px;
    cursor: pointer; transition: background 0.2s;
  }
  .update-row:hover { background: rgba(219,234,254,0.8); }
  .update-row .left { display: flex; align-items: center; gap: 10px; }
  .update-row .icon {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--paper);
    display: flex; align-items: center; justify-content: center;
    color: var(--blue);
  }
  .update-row .name { font-size: 13px; font-weight: 600; color: var(--navy); }
  .update-row .meta-sm { font-size: 10px; color: var(--muted); margin-top: 1px; }

  .seg {
    display: flex; background: var(--cream);
    border-radius: 14px; padding: 4px; gap: 2px;
    margin: 6px 0 14px;
  }
  .seg button {
    flex: 1; border: none; background: transparent;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 600;
    padding: 8px 10px; border-radius: 10px;
    color: var(--muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .seg button.active {
    background: var(--paper); color: var(--navy);
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }

  .ledger-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0; border-bottom: 1px solid var(--border-soft);
  }
  .ledger-row:last-child { border-bottom: none; }
  .ledger-row .name { font-size: 14px; font-weight: 500; color: var(--ink); }
  .ledger-row .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }

  .add-btn {
    width: 100%; padding: 10px;
    border-radius: 12px; background: transparent;
    border: 1px dashed var(--border); color: var(--muted);
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    cursor: pointer; margin-top: 10px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .add-btn:hover { border-color: var(--blue); color: var(--blue); }

  .field { display: flex; flex-direction: column; margin-bottom: 14px; }
  .field label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 5px;
  }
  .field input, .field textarea, .field select {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; color: var(--ink);
    padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--paper); outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--blue); }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .chat-msgs {
    flex: 1; overflow-y: auto;
    padding: 10px 4px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .chat-bubble {
    max-width: 85%; padding: 10px 14px;
    border-radius: 16px;
    font-size: 13.5px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .chat-bubble.user {
    align-self: flex-end;
    background: var(--navy); color: var(--paper);
    border-bottom-right-radius: 4px;
  }
  .chat-bubble.assistant {
    align-self: flex-start;
    background: var(--paper); border: 1px solid var(--border-soft);
    color: var(--ink); border-bottom-left-radius: 4px;
  }
  .chat-input {
    display: flex; gap: 8px;
    padding: 10px 4px 0;
    border-top: 1px solid var(--border-soft);
    margin-top: 8px;
  }
  .chat-input input {
    flex: 1; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: 999px;
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    outline: none;
  }
  .chat-input input:focus { border-color: var(--blue); }
  .chat-send {
    width: 38px; height: 38px;
    border: none; background: var(--navy); color: var(--paper);
    border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .chat-send:disabled { background: var(--border); cursor: not-allowed; }

  .chat-empty {
    text-align: center; padding: 20px 16px;
    color: var(--muted); font-size: 13px;
  }
  .chat-empty .glyph {
    width: 48px; height: 48px; margin: 0 auto 12px;
    background: var(--blue-soft);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--blue-deep);
  }
  .chat-empty h3 {
    font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 18px; color: var(--navy); margin: 0 0 6px;
  }
  .suggest-chip {
    display: inline-block; padding: 6px 12px; margin: 4px;
    background: var(--paper); border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 11.5px; color: var(--ink); cursor: pointer;
  }
  .suggest-chip:hover { border-color: var(--blue); color: var(--blue-deep); }

  .demo-banner {
    background: rgba(245, 158, 11, 0.08);
    border: 1px solid rgba(245, 158, 11, 0.3);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 12px;
    font-size: 11px;
    color: #92400e;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }
  .demo-banner .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--amber);
    flex-shrink: 0;
    margin-top: 5px;
  }

  .bottom-nav {
    background: var(--paper);
    border-top: 1px solid var(--border-soft);
    padding: 8px 4px 14px;
    display: grid; grid-template-columns: repeat(5, 1fr);
  }
  .nav-btn {
    background: transparent; border: none;
    padding: 6px 4px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 10px; font-weight: 500;
  }
  .nav-btn.active { color: var(--navy); }
  .nav-btn.active .nav-icon-wrap { background: var(--blue-soft); color: var(--blue-deep); }
  .nav-icon-wrap {
    width: 32px; height: 32px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }

  .ext-footer {
    margin-top: 24px;
    font-size: 11px; color: var(--muted); text-align: center;
    font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em;
    max-width: 420px;
  }
  .ext-footer a { color: var(--blue-deep); text-decoration: none; }

  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  @media (max-width: 440px) {
    .phone { border-radius: 0; height: calc(100vh - 32px); width: 100%; }
    .ext-bg { padding: 0; }
    .ext-header { display: none; }
    .ext-footer { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useMemo, useRef, useEffect } = React;
const {
  Sankey, Layer, Rectangle, BarChart, Bar, XAxis, YAxis,
  ResponsiveContainer, PieChart, Pie, Cell, Tooltip, CartesianGrid,
} = Recharts;

/* ---------- inline SVG icons (replaces lucide-react) ---------- */
const Icon = ({ d, size = 16, stroke = "currentColor", fill = "none", ...rest }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
       fill={fill} stroke={stroke} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...rest}>
    {d}
  </svg>
);
const HomeIcon = (p) => <Icon {...p} d={<><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></>}/>;
const BookOpen = (p) => <Icon {...p} d={<><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></>}/>;
const Compass = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></>}/>;
const MessageSquare = (p) => <Icon {...p} d={<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>}/>;
const SettingsIcon = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>}/>;
const EyeOff = (p) => <Icon {...p} d={<><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></>}/>;
const Eye = (p) => <Icon {...p} d={<><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>}/>;
const ChevronRight = (p) => <Icon {...p} d={<polyline points="9 18 15 12 9 6"/>}/>;
const Sparkles = (p) => <Icon {...p} d={<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/>}/>;
const Plus = (p) => <Icon {...p} d={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>}/>;
const Send = (p) => <Icon {...p} d={<><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></>}/>;
const TrendingUp = (p) => <Icon {...p} d={<><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></>}/>;
const ArrowRight = (p) => <Icon {...p} d={<><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></>}/>;
const Trash2 = (p) => <Icon {...p} d={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></>}/>;
const Loader2 = (p) => <Icon {...p} d={<path d="M21 12a9 9 0 11-6.219-8.56"/>}/>;
const PieChartIcon = (p) => <Icon {...p} d={<><path d="M21.21 15.89A10 10 0 118 2.83"/><path d="M22 12A10 10 0 0012 2v10z"/></>}/>;
const Info = (p) => <Icon {...p} d={<><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></>}/>;

/* ---------- color constants ---------- */
const NAVY = "#0f1729", INK = "#1a1a2e", MUTED = "#6b7280";
const BORDER = "#e5e7eb", BORDER_SOFT = "#eef0f3";
const CREAM = "#f5f1ea", PAPER = "#fcfbf7";
const BLUE = "#2563eb", BLUE_SOFT = "#dbeafe", BLUE_DEEP = "#1e40af";
const GREEN = "#059669", AMBER = "#f59e0b";

const CATEGORY_COLORS = {
  Housing: "#2563eb", Food: "#7c3aed", Transport: "#0891b2",
  Health: "#dc2626", Entertainment: "#f59e0b",
  Education: "#059669", Other: "#64748b",
};

const STORAGE_KEY = "agentic_fire_planner_v1";

const INITIAL_STATE = {
  income: [
    { id: 1, name: "Salary", annualUSD: 185000 },
    { id: 2, name: "RSU", annualUSD: 65000 },
    { id: 3, name: "Bonus", annualUSD: 28000 },
  ],
  expenses: [
    { id: 1, category: "Housing", monthlyUSD: 3400 },
    { id: 2, category: "Food", monthlyUSD: 1200 },
    { id: 3, category: "Transport", monthlyUSD: 700 },
    { id: 4, category: "Health", monthlyUSD: 450 },
    { id: 5, category: "Education", monthlyUSD: 2800 },
    { id: 6, category: "Entertainment", monthlyUSD: 600 },
    { id: 7, category: "Other", monthlyUSD: 850 },
  ],
  assets: [
    { id: 1, name: "401(k)", type: "Retirement", valueUSD: 380000 },
    { id: 2, name: "Roth IRA", type: "Retirement", valueUSD: 95000 },
    { id: 3, name: "Brokerage (VTI/VXUS)", type: "Brokerage", valueUSD: 240000 },
    { id: 4, name: "HYSA / Emergency", type: "Cash", valueUSD: 75000 },
    { id: 5, name: "India MFs (NRO)", type: "India", valueUSD: 48000 },
    { id: 6, name: "Primary residence", type: "Real estate", valueUSD: 720000 },
  ],
  liabilities: [
    { id: 1, name: "Mortgage", balanceUSD: 410000, ratePct: 6.25 },
    { id: 2, name: "Auto loan", balanceUSD: 22000, ratePct: 5.9 },
  ],
  context: {
    age: 42, spouseAge: 39, children: 2,
    visaStatus: "Green Card (since 2022)",
    plannedReturnYear: 2032,
    targetCorpusUSD: 1800000,
    notes: "Two daughters — eldest at boarding school. Want to optimize RNOR window before triggering ROR. Spouse considering part-time consulting in India.",
  },
  settings: {
    displayCurrency: "INR",
    fxUSDtoINR: 83.5,
    nominalReturnPct: 7.0,
    inflationPct: 4.5,
    effectiveTaxPct: 26,
    projectionYears: 15,
  },
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return INITIAL_STATE;
    const parsed = JSON.parse(raw);
    return {
      ...INITIAL_STATE,
      ...parsed,
      settings: { ...INITIAL_STATE.settings, ...(parsed.settings || {}) },
      context: { ...INITIAL_STATE.context, ...(parsed.context || {}) },
    };
  } catch (e) { return INITIAL_STATE; }
}

function fmtCurrency(usd, state, opts = {}) {
  const { displayCurrency, fxUSDtoINR } = state.settings;
  const compact = opts.compact ?? true;
  if (displayCurrency === "INR") {
    const inr = usd * fxUSDtoINR;
    if (compact) {
      if (Math.abs(inr) >= 1e7) return `₹${(inr / 1e7).toFixed(2)} Cr`;
      if (Math.abs(inr) >= 1e5) return `₹${(inr / 1e5).toFixed(2)} L`;
      return `₹${Math.round(inr).toLocaleString("en-IN")}`;
    }
    return `₹${Math.round(inr).toLocaleString("en-IN")}`;
  }
  if (compact) {
    if (Math.abs(usd) >= 1e6) return `$${(usd / 1e6).toFixed(2)}M`;
    if (Math.abs(usd) >= 1e3) return `$${(usd / 1e3).toFixed(1)}K`;
  }
  return `$${Math.round(usd).toLocaleString("en-US")}`;
}

function useDerived(state) {
  return useMemo(() => {
    const grossIncomeUSD = state.income.reduce((a, b) => a + b.annualUSD, 0);
    const taxUSD = grossIncomeUSD * (state.settings.effectiveTaxPct / 100);
    const netIncomeUSD = grossIncomeUSD - taxUSD;
    const annualExpensesUSD = state.expenses.reduce((a, b) => a + b.monthlyUSD, 0) * 12;
    const savingsUSD = Math.max(netIncomeUSD - annualExpensesUSD, 0);
    const assetsUSD = state.assets.reduce((a, b) => a + b.valueUSD, 0);
    const liabilitiesUSD = state.liabilities.reduce((a, b) => a + b.balanceUSD, 0);
    const netWorthUSD = assetsUSD - liabilitiesUSD;
    const investableUSD = state.assets.filter((a) => a.type !== "Real estate").reduce((a, b) => a + b.valueUSD, 0);
    return { grossIncomeUSD, taxUSD, netIncomeUSD, annualExpensesUSD, savingsUSD, assetsUSD, liabilitiesUSD, netWorthUSD, investableUSD };
  }, [state]);
}

function projectWealth(state, derived) {
  const { nominalReturnPct, inflationPct, projectionYears } = state.settings;
  const r = nominalReturnPct / 100;
  const inf = inflationPct / 100;
  const series = [];
  let nw = derived.netWorthUSD;
  let savings = derived.savingsUSD;
  for (let i = 0; i < projectionYears; i++) {
    const year = new Date().getFullYear() + i;
    const returnsThisYear = nw * r;
    const cumulativeSavings = i === 0 ? savings : series[i - 1].cumSavings + savings;
    series.push({
      year, yearLabel: `'${String(year).slice(2)}`,
      netWorthUSD: nw, cumSavings: cumulativeSavings, returnsUSD: returnsThisYear,
    });
    nw = nw * (1 + r) + savings;
    savings = savings * (1 + inf);
  }
  return series;
}

function SankeyView({ state, derived }) {
  const sources = state.income.map((i) => ({ name: i.name, value: i.annualUSD }));
  const grossIdx = sources.length;
  const taxIdx = grossIdx + 1, netIdx = grossIdx + 2;
  const invIdx = grossIdx + 3, savIdx = grossIdx + 4, expIdx = grossIdx + 5;

  const nodes = [
    ...sources.map((s) => ({ name: s.name })),
    { name: "All income" }, { name: "Taxes" }, { name: "Net income" },
    { name: "Investments" }, { name: "Savings" }, { name: "Expenses" },
  ];

  const investUSD = derived.savingsUSD * 0.7;
  const stashUSD = derived.savingsUSD * 0.3;
  const links = [];
  sources.forEach((src, i) => links.push({ source: i, target: grossIdx, value: Math.max(src.value, 1) }));
  links.push({ source: grossIdx, target: taxIdx, value: Math.max(derived.taxUSD, 1) });
  links.push({ source: grossIdx, target: netIdx, value: Math.max(derived.netIncomeUSD, 1) });
  links.push({ source: netIdx, target: invIdx, value: Math.max(investUSD, 1) });
  links.push({ source: netIdx, target: savIdx, value: Math.max(stashUSD, 1) });
  links.push({ source: netIdx, target: expIdx, value: Math.max(derived.annualExpensesUSD, 1) });

  const data = { nodes, links };
  const totalNet = derived.netIncomeUSD || 1;
  const labels = {
    Investments: `${Math.round((investUSD / totalNet) * 100)}%`,
    Savings: `${Math.round((stashUSD / totalNet) * 100)}%`,
    Expenses: `${Math.round((derived.annualExpensesUSD / totalNet) * 100)}%`,
  };

  const SankeyNode = ({ x, y, width, height, payload }) => {
    const name = payload.name;
    const isOutput = ["Investments", "Savings", "Expenses", "Taxes"].includes(name);
    const isCenter = ["All income", "Net income"].includes(name);
    const fill = isCenter ? BLUE_DEEP : BLUE;
    const lblRight = isOutput;
    const labelText = isOutput && labels[name] ? `${name} ${labels[name]}` : name;
    return (
      <Layer>
        <Rectangle x={x} y={y} width={width} height={height} fill={fill} fillOpacity={0.95} />
        <text x={lblRight ? x + width + 6 : x - 6} y={y + height / 2}
              textAnchor={lblRight ? "start" : "end"} dominantBaseline="middle"
              fontFamily="DM Sans, sans-serif" fontSize={9.5} fontWeight={500} fill={INK}>
          {labelText}
        </text>
      </Layer>
    );
  };

  return (
    <div style={{ background: PAPER, borderRadius: 16, border: `1px solid ${BORDER_SOFT}`, padding: "10px 8px 30px", height: 280 }}>
      <ResponsiveContainer width="100%" height="100%">
        <Sankey data={data} node={<SankeyNode />} nodePadding={14} nodeWidth={6}
          link={{ stroke: BLUE, strokeOpacity: 0.18, fill: BLUE, fillOpacity: 0.18 }}
          margin={{ top: 6, right: 70, bottom: 6, left: 50 }}>
          <Tooltip formatter={(v) => fmtCurrency(v, state)} contentStyle={{ fontSize: 11, fontFamily: "DM Sans" }} />
        </Sankey>
      </ResponsiveContainer>
    </div>
  );
}

              <div style={{ width: `${pct}%`, height: "100%", background: r.color, borderRadius: 3 }} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

          <div className="meta">Target year: {c.plannedReturnYear}</div>

      <div style={{ background: PAPER, borderRadius: 14, border: `1px solid ${BORDER_SOFT}`, padding: "16px" }}>

          <div className="field"><label>Return year</label>
            <input type="number" value={c.plannedReturnYear} onChange={(e) => setCtx({ plannedReturnYear: parseInt(e.target.value || 0) })} /></div>
        </div>
        <div className="field"><label>Visa status</label>

/* =========================================================================
   CHAT — demo mode with smart sample responses
   ========================================================================= */
const SAMPLE_RESPONSES = [
  {
    keywords: ["track", "corpus", "target", "on pace", "reach"],
    response: (state, derived) => {
      const yrs = state.context.plannedReturnYear - new Date().getFullYear();
      const r = state.settings.nominalReturnPct / 100;
      const projected = derived.netWorthUSD * Math.pow(1 + r, yrs) +
        derived.savingsUSD * (Math.pow(1 + r, yrs) - 1) / r;
      const fmt = (v) => fmtCurrency(v, state);
      const gap = state.context.targetCorpusUSD - projected;
      const onTrack = projected >= state.context.targetCorpusUSD;
      return `Directionally — ${onTrack ? "yes" : "not quite"}.

At your current trajectory (${state.settings.nominalReturnPct}% nominal, ${fmt(derived.savingsUSD)}/yr savings), you'd land near ${fmt(projected)} by ${state.context.plannedReturnYear}. Your target is ${fmt(state.context.targetCorpusUSD)}.

${onTrack
  ? `That's roughly ${fmt(projected - state.context.targetCorpusUSD)} of cushion. Worth stress-testing against a 4% inflation scenario in India and the cost of education for your ${state.context.children} kids — those line items eat cushion fast.`
  : `Gap of about ${fmt(Math.abs(gap))}. Three levers: bump savings rate, push return year out by 2-3 years (compounding does heavy lifting late), or revise the target down once you've built a real India cost-of-living model.`}

(Run with a CA who knows cross-border before locking decisions.)`;
    }
  },
  {
    keywords: ["delay", "push", "later", "extend", "3 year", "five year", "more year"],
    response: (state, derived) => {
      const r = state.settings.nominalReturnPct / 100;
      const fmt = (v) => fmtCurrency(v, state);
      const baseYrs = state.context.plannedReturnYear - new Date().getFullYear();
      const baseProj = derived.netWorthUSD * Math.pow(1 + r, baseYrs) +
        derived.savingsUSD * (Math.pow(1 + r, baseYrs) - 1) / r;
      const delayedYrs = baseYrs + 3;
      const delayedProj = derived.netWorthUSD * Math.pow(1 + r, delayedYrs) +
        derived.savingsUSD * (Math.pow(1 + r, delayedYrs) - 1) / r;
      const diff = delayedProj - baseProj;
      return `Three more years of compounding adds roughly ${fmt(diff)} to your corpus.

Base case (${state.context.plannedReturnYear}): ~${fmt(baseProj)}
Delayed by 3 (${state.context.plannedReturnYear + 3}): ~${fmt(delayedProj)}

The financial side is clean. The non-financial side is harder: parents 3 years older, kids 3 years deeper into US school systems, your professional network 3 years more US-anchored. RNOR window also shifts — you'd want to verify how those years affect your residency status under Section 6 before committing.

What's the actual reason you're considering the delay?`;
    }
  },
  {
    keywords: ["rnor", "401k", "401(k)", "rollover", "withdraw", "ira"],
    response: (state, derived) => {
      const fmt = (v) => fmtCurrency(v, state);
      const ret401k = state.assets.find(a => a.name.toLowerCase().includes("401")) || { valueUSD: 0 };
      return `Your ${fmt(ret401k.valueUSD)} 401(k) is the highest-stakes piece in a return scenario.

Once you become ROR (Resident and Ordinarily Resident — typically 2-3 years after return), India taxes worldwide income including 401k growth and distributions. During RNOR (your first 2-3 years back), foreign-sourced income is generally outside India's tax net.

Three patterns NRIs typically consider:

1. Roth conversion ladder while still US-resident — pay the tax in your current bracket before moving brackets shift on you.
2. Drain traditional 401k during RNOR window — distributions taxed only in US (10% penalty if pre-59½, plus federal/state).
3. Leave it, deal with it later — simplest, but then you're navigating ROR-era taxation on every distribution.

Section 89A / Form 10-EE provides relief by deferring India taxation on US retirement accounts until withdrawal — worth understanding before you decide.

(Strategy here depends heavily on your bracket, age at return, and Form 8854 considerations if you ever expatriate. Get a cross-border CA.)`;
    }
  },
  {
    keywords: ["leak", "weakness", "risk", "wrong", "biggest", "issue", "problem"],
    response: (state, derived) => {
      const fmt = (v) => fmtCurrency(v, state);
      const monthly = state.expenses.reduce((a, b) => a + b.monthlyUSD, 0);
      const housing = state.expenses.find(e => e.category === "Housing")?.monthlyUSD || 0;
      const housingPct = Math.round((housing / monthly) * 100);
      const indiaMF = state.assets.find(a => a.type === "India")?.valueUSD || 0;
      return `Three things stand out from your numbers:

1. Housing is ${housingPct}% of your monthly burn (${fmt(housing * 12)}/yr). Above 30% gets brittle in a layoff scenario, especially with the ${state.liabilities[0]?.ratePct || "current"}% mortgage rate. Worth modeling what a 6-month income gap looks like.

2. ${fmt(indiaMF)} in India MFs as a US tax resident triggers PFIC reporting (Form 8621). Mark-to-market or QEF election decisions matter — and ordinary mutual funds in India almost always lack QEF reporting, so you're stuck with punitive default treatment. Single biggest tax-paperwork landmine I see in NRI portfolios.

3. Your expenses are dollar-denominated, but your future is rupee-denominated. A weakening rupee makes your USD corpus more powerful in India — but exposes you to currency risk in the years before return. Your ${fmt(state.assets.find(a => a.type === "Cash")?.valueUSD || 0)} cash position is fine for emergencies but earning real-negative returns vs. inflation.

The 401k question is bigger than all three combined, but those are the leaks visible from the numbers alone.`;
    }
  },
  {
    keywords: ["pfic", "india mf", "mutual fund", "form 8621"],
    response: (state, derived) => {
      const indiaMF = state.assets.find(a => a.type === "India")?.valueUSD || 0;
      const fmt = (v) => fmtCurrency(v, state);
      return `You hold ${fmt(indiaMF)} in India MFs. As a US tax resident, those are PFICs (Passive Foreign Investment Companies).

Three regimes you can be taxed under:
- Default (Section 1291): excess distribution rules — punitive, you pay top marginal rate plus interest on deferred gains
- QEF election: requires the fund to provide annual statements (almost no Indian MF does)
- Mark-to-market: tax annual gains as ordinary income, no special rate

Most NRIs end up defaulted into Section 1291 because Indian AMCs don't supply QEF data. Form 8621 is required per fund per year regardless.

Practical paths:
- Hold via NRO/NRE in fixed deposits or direct equities (not PFIC)
- Move that allocation into US-listed India ETFs (INDA, FLIN) — same exposure, no PFIC
- Keep the India MFs but be religious about Form 8621 filings and the M2M election

This single decision is often worth more than rebalancing your asset allocation.`;
    }
  },
];

const FALLBACK_RESPONSE = (state, derived) => {
  const fmt = (v) => fmtCurrency(v, state);
  return `[Demo mode — sample response]

Looking at your situation: ${fmt(derived.netWorthUSD)} net worth, ${fmt(derived.savingsUSD)}/yr saved, ${state.context.plannedReturnYear - new Date().getFullYear()} years to your planned return.

In the live version, I'd parse your specific question and run a scenario against your actual numbers — RNOR optimization, 401k strategy, target corpus pacing, currency risk, education funding, parent care logistics.

For now, try one of the suggested questions below — they show how the agent reasons over your real data.

(This demo runs canned responses. The full version connects to Claude Sonnet 4 with your full ledger and context loaded into the system prompt.)`;
};

function pickResponse(question, state, derived) {
  const q = question.toLowerCase();
  for (const r of SAMPLE_RESPONSES) {
    if (r.keywords.some(k => q.includes(k))) return r.response(state, derived);
  }
  return FALLBACK_RESPONSE(state, derived);
}

function ChatTab({ state, setTab }) {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [loading, setLoading] = useState(false);
  const scrollRef = useRef(null);
  const derived = useDerived(state);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, loading]);

  const suggestions = [
    "Am I on track for my target corpus?",
    "What if I delay return by 3 years?",
    "How does RNOR change my 401k strategy?",
    "Where are the biggest leaks in my plan?",
    "What about my India mutual funds?",
  ];

  const send = async (text) => {
    const msg = text.trim();
    if (!msg || loading) return;
    setMessages((m) => [...m, { role: "user", content: msg }]);
    setInput("");
    setLoading(true);
    setTimeout(() => {
      const reply = pickResponse(msg, state, derived);
      setMessages((m) => [...m, { role: "assistant", content: reply }]);
      setLoading(false);
    }, 900 + Math.random() * 600);
  };

  return (
    <div className="tab-content" style={{ display: "flex", flexDirection: "column" }}>
      <div className="tab-header">
        <h1 className="tab-title">Chat</h1>
        <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 10, color: MUTED, fontFamily: "JetBrains Mono", letterSpacing: "0.05em" }}>
          <span style={{ width: 6, height: 6, borderRadius: "50%", background: AMBER }} />
          DEMO MODE
        </div>
      </div>

      <div className="demo-banner">
        <span className="dot" />
        <span>This is a demo. Try the suggested questions to see how the agent reasons over your numbers. Live API not wired up yet — let me know on r/nriFIRE if you want it.</span>
      </div>

      <div className="chat-msgs" ref={scrollRef} style={{ minHeight: 340 }}>
        {messages.length === 0 && (
          <div className="chat-empty">
            <div className="glyph"><Sparkles size={20} /></div>
            <h3>Ask the agent anything</h3>
            <div style={{ marginBottom: 14 }}>It can see your full ledger and context. Try:</div>
            <div>
              {suggestions.map((s) => (
                <span key={s} className="suggest-chip" onClick={() => send(s)}>{s}</span>
              ))}
            </div>
            <div style={{ marginTop: 18, fontSize: 11, color: MUTED }}>
              Edit your situation in <span style={{ color: BLUE, cursor: "pointer", textDecoration: "underline" }} onClick={() => setTab("context")}>Context →</span>
            </div>
          </div>
        )}
        {messages.map((m, i) => (
          <div key={i} className={`chat-bubble ${m.role}`}>{m.content}</div>
        ))}
        {loading && (
          <div className="chat-bubble assistant" style={{ display: "flex", alignItems: "center", gap: 6, color: MUTED }}>
            <Loader2 size={13} className="spin" />
            <span>thinking…</span>
          </div>
        )}
      </div>

      <div className="chat-input">
        <input value={input}
          onChange={(e) => setInput(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && send(input)}
          placeholder="Ask about your plan…" />
        <button className="chat-send" onClick={() => send(input)} disabled={loading || !input.trim()}>
          <Send size={14} />
        </button>
      </div>
    </div>
  );
}

  return (
    <div className="tab-content">
      <div className="tab-header"><h1 className="tab-title">Settings</h1></div>

      <div style={{ background: PAPER, borderRadius: 14, border: `1px solid ${BORDER_SOFT}`, padding: "16px", marginBottom: 12 }}>

        <div className="field"><label>Currency</label>
          <select value={s.displayCurrency} onChange={(e) => set({ displayCurrency: e.target.value })}>
            <option value="INR">INR (₹)</option>

          </select>
        </div>
        <div className="field"><label>FX rate (1 USD = ₹)</label>
          <input type="number" step="0.1" value={s.fxUSDtoINR}
            onChange={(e) => set({ fxUSDtoINR: parseFloat(e.target.value || 0) })} />
        </div>
      </div>

      <div style={{ background: PAPER, borderRadius: 14, border: `1px solid ${BORDER_SOFT}`, padding: "16px", marginBottom: 12 }}>
        <div style={{ fontFamily: "JetBrains Mono", fontSize: 9, letterSpacing: "0.14em", textTransform: "uppercase", color: MUTED, marginBottom: 12 }}>Projection assumptions</div>
        <div className="field-row">
          <div className="field"><label>Nominal return %</label>
            <input type="number" step="0.1" value={s.nominalReturnPct}
              onChange={(e) => set({ nominalReturnPct: parseFloat(e.target.value || 0) })} /></div>
          <div className="field"><label>Inflation %</label>
            <input type="number" step="0.1" value={s.inflationPct}
              onChange={(e) => set({ inflationPct: parseFloat(e.target.value || 0) })} /></div>
        </div>
        <div className="field-row">
          <div className="field"><label>Effective tax %</label>
            <input type="number" step="0.5" value={s.effectiveTaxPct}
              onChange={(e) => set({ effectiveTaxPct: parseFloat(e.target.value || 0) })} /></div>
          <div className="field"><label>Projection years</label>
            <input type="number" value={s.projectionYears}
              onChange={(e) => set({ projectionYears: parseInt(e.target.value || 0) })} /></div>
        </div>
      </div>

      <button onClick={reset} style={{
        width: "100%", padding: "12px", borderRadius: 12,
        background: "transparent", border: `1px solid ${BORDER}`,
        color: "#dc2626", fontFamily: "DM Sans", fontSize: 13, fontWeight: 500,
        cursor: "pointer", marginBottom: 12,
      }}>Reset all data</button>

      <div style={{ padding: "14px", background: CREAM, borderRadius: 12, fontSize: 11, color: MUTED, lineHeight: 1.5 }}>
        Your data is stored locally in your browser only. Never sent anywhere. Clear browser data → data is gone.
      </div>
    </div>
  );
}
